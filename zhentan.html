<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深圳MMK侦探事务所の侦探报告生成器</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#262b36;
    --text:#e6e8ee; --sub:#9aa3b2; --accent:#4f8cff; --accent2:#22c55e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6; padding:16px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  h1{font-size:20px; text-align:center; margin:8px 0 4px;}
  .tip{text-align:center; color:var(--sub); font-size:13px; margin-bottom:12px;}

  /* 模板切换 */
  .switch{display:flex; gap:8px; justify-content:center; margin-bottom:18px; flex-wrap:wrap;}
  .switch a{
    padding:7px 18px; border-radius:999px; font-size:13px; text-decoration:none;
    border:1px solid var(--line); color:var(--sub); background:var(--card);
    transition:.2s;
  }
  .switch a:hover{color:var(--text); border-color:var(--accent);}
  .switch a.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  /* 粘贴解析区 */
  .paste-box{
    background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:16px; margin-bottom:20px;
  }
  .paste-box label{
    display:block; font-size:13px; color:var(--accent);
    font-weight:600; margin-bottom:8px;
  }
  #pasteInput{
    width:100%; min-height:120px; resize:vertical;
    background:#0d0f14; color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; font-size:13px;
    font-family:"PingFang SC","Microsoft YaHei",monospace; outline:none;
  }
  #pasteInput:focus{border-color:var(--accent);}
  .paste-btns{display:flex; gap:12px; margin-top:10px;}
  .paste-btns button{
    flex:1; padding:10px; border-radius:8px; border:none;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  #parseBtn{background:var(--accent); color:#fff;}
  #clearPasteBtn{background:#2a2f3a; color:var(--text);}

  fieldset{
    border:1px solid var(--line); border-radius:12px;
    padding:16px; margin:0 0 16px; background:var(--card);
  }
  legend{padding:0 8px; font-size:14px; color:var(--accent); font-weight:600;}
  label{display:block; font-size:13px; color:var(--sub); margin:12px 0 6px;}
  label:first-of-type{margin-top:0;}
  .req{color:#ff6b6b;}
  input,textarea,select{
    width:100%; padding:10px 12px; border-radius:8px;
    border:1px solid var(--line); background:#0d0f14; color:var(--text);
    font-size:14px; font-family:inherit; outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  textarea{resize:vertical; min-height:80px;}
  .row{display:flex; gap:12px;}
  .row > div{flex:1;}

  .btns{display:flex; gap:12px; margin:20px 0;}
  button{
    flex:1; padding:12px; border-radius:10px; border:none;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  #genBtn{background:var(--accent); color:#fff;}
  #copyBtn{background:var(--accent2); color:#fff;}
  #resetBtn{background:#2a2f3a; color:var(--text);}
  #preview{
    white-space:pre-wrap; word-break:break-word;
    background:#0d0f14; border:1px solid var(--line); border-radius:12px;
    padding:16px; font-size:14px; line-height:1.8; min-height:120px;
    font-family:"PingFang SC","Microsoft YaHei",monospace;
  }
  .placeholder{color:var(--sub);}
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
    background:var(--accent2); color:#fff; padding:10px 20px;
    border-radius:8px; font-size:14px; opacity:0; pointer-events:none;
    transition:opacity .25s; z-index:99;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <h1>深圳MMK侦探事务所の侦探报告</h1>
  <div class="tip">填写信息 → 点击生成 → 复制到 Telegram</div>

  <!-- 模板切换 -->
  <div class="switch">
    <a href="wsw.html">🚢 委托报告</a>
    <a href="hangxian.html">⛵ 航线报告</a>
    <a href="zhentan.html" class="active">🔍 侦探报告</a>
  </div>

  <!-- 粘贴解析区 -->
  <div class="paste-box">
    <label>📥 粘贴已有侦探报告，自动填充下方表单</label>
    <textarea id="pasteInput" placeholder="把完整的侦探报告粘贴到这里，然后点「解析填充」"></textarea>
    <div class="paste-btns">
      <button id="parseBtn">解析填充</button>
      <button id="clearPasteBtn">清空粘贴区</button>
    </div>
  </div>

  <!-- 基本信息 -->
  <fieldset>
    <legend>基本信息</legend>

    <label>案件发生地 <span class="req">*</span></label>
    <input id="place" list="placeList" placeholder="请选择或输入案件发生地">
    <datalist id="placeList"></datalist>

    <label>嫌疑人姓名 <span class="req">*</span></label>
    <input id="target" list="targetList" placeholder="请选择或输入嫌疑人姓名">
    <datalist id="targetList"></datalist>

    <div class="row">
      <div>
        <label>日期 <span class="req">*</span></label>
        <input id="date" type="date">
      </div>
      <div>
        <label>消费 <span class="req">*</span></label>
        <input id="fee" placeholder="例如：999">
      </div>
    </div>

    <label>#名侦探🕵️ <span class="req">*</span></label>
    <input id="detective" placeholder="自己的昵称">

    <label>店家联系方式 <span class="req">*</span></label>
    <input id="contact" placeholder="例如：@bujidaotoutou">
  </fieldset>

  <!-- 评分（一行两列，支持填 X 表示不适用） -->
  <fieldset>
    <legend>评分（填 0-10，或填 X 表示不适用；综合评价 1-10）</legend>

    <div class="row">
      <div>
        <label>人照符合度 <span class="req">*</span></label>
        <input id="s_match" type="text" inputmode="decimal" placeholder="0-10 或 X">
      </div>
      <div>
        <label>颜值 <span class="req">*</span></label>
        <input id="s_face" type="text" inputmode="decimal" placeholder="0-10 或 X">
      </div>
    </div>

    <div class="row">
      <div>
        <label>上路 <span class="req">*</span></label>
        <input id="s_top" type="text" inputmode="decimal" placeholder="0-10 或 X">
      </div>
      <div>
        <label>中路 <span class="req">*</span></label>
        <input id="s_mid" type="text" inputmode="decimal" placeholder="0-10 或 X">
      </div>
    </div>

    <div class="row">
      <div>
        <label>综合评价 <span class="req">*</span></label>
        <input id="s_all" type="text" inputmode="decimal" placeholder="1-10 或 X">
      </div>
      <div></div>
    </div>
  </fieldset>

  <!-- 文字描述 -->
  <fieldset>
    <legend>文字描述</legend>

    <label>身材 <span class="req">*</span></label>
    <textarea id="body" placeholder="例如：身高165，体型匀称……"></textarea>

    <label>性格 <span class="req">*</span></label>
    <textarea id="char" placeholder="例如：温柔健谈，主动不冷场……"></textarea>
  </fieldset>

  <!-- 正文 -->
  <fieldset>
    <legend>详细体验</legend>

    <label>详细体验 <span class="req">*</span></label>
    <textarea id="experience" placeholder="自由发挥，尽量详细……"></textarea>
  </fieldset>

  <div class="btns">
    <button id="genBtn">生成报告</button>
    <button id="copyBtn">复制报告</button>
    <button id="resetBtn">清空</button>
  </div>

  <!-- 预览 -->
  <fieldset>
    <legend>报告预览</legend>
    <div id="preview" class="placeholder">点击「生成报告」后，最终内容会显示在这里。</div>
  </fieldset>
</div>

<div class="toast" id="toast">已复制到剪贴板 ✓</div>

<!-- 共用数据文件（与 wsw.html / hangxian.html 同一份 data.js） -->
<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);

/* ---------- 固定归档信息 ---------- */
const ARCHIVE_ZT = `报告审核: @limanman886  @bayesprism 
侦探事务所: https://t.me/szmmk_7
侦探事务所卷宗: https://t.me/sz_mmk_jz`;

/* ---------- 初始化案件发生地建议（共用 data.js 的键） ---------- */
function initPlaces(){
  const list = $('placeList');
  Object.keys(REPORT_DATA).forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    list.appendChild(opt);
  });
}

/* ---------- 案件发生地输入 → 刷新嫌疑人姓名建议（共用 data.js 的值） ---------- */
$('place').addEventListener('input', () => {
  const place = $('place').value.trim();
  const targetList = $('targetList');
  targetList.innerHTML = '';

  const list = REPORT_DATA[place] || [];
  list.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    targetList.appendChild(opt);
  });
});

/* ---------- 评分小写 x 自动转大写 X ---------- */
document.querySelectorAll('input[inputmode="decimal"]').forEach(el => {
  el.addEventListener('blur', () => {
    if(el.value.trim().toUpperCase() === 'X'){
      el.value = 'X';
    }
  });
});

/* ---------- 必填校验表 ---------- */
const REQUIRED = [
  { id:'place',      name:'案件发生地' },
  { id:'target',     name:'嫌疑人姓名' },
  { id:'date',       name:'日期' },
  { id:'fee',        name:'消费' },
  { id:'detective',  name:'#名侦探🕵️' },
  { id:'contact',    name:'店家联系方式' },
  { id:'s_match',    name:'人照符合度', isScore:true },
  { id:'s_face',     name:'颜值',       isScore:true },
  { id:'s_top',      name:'上路',       isScore:true },
  { id:'s_mid',      name:'中路',       isScore:true },
  { id:'s_all',      name:'综合评价',   isScore:true, min:1 },
  { id:'body',       name:'身材' },
  { id:'char',       name:'性格' },
  { id:'experience', name:'详细体验' }
];

function validate(){
  for(const item of REQUIRED){
    const el = $(item.id);
    const val = el.value.trim();

    if(!val){
      showToast(`❌ ${item.name} 不能为空`, true);
      el.focus();
      return false;
    }

    if(item.isScore){
      // 允许 X
      if(val.toUpperCase() === 'X') continue;

      const num = Number(val);
      const min = item.min !== undefined ? item.min : 0;
      if(isNaN(num) || num < min || num > 10){
        showToast(`❌ ${item.name} 必须填 ${min} - 10 或 X`, true);
        el.focus();
        el.select();
        return false;
      }
    }
  }
  return true;
}

/* ---------- 生成报告 ---------- */
function buildReport(){
  const place      = $('place').value.trim();
  const target     = $('target').value.trim();
  const dateRaw    = $('date').value;
  const date       = dateRaw || '';
  const fee        = $('fee').value.trim();
  const detective  = $('detective').value.trim();
  const contact    = $('contact').value.trim();

  const sMatch = $('s_match').value.trim();
  const sFace  = $('s_face').value.trim();
  const sTop   = $('s_top').value.trim();
  const sMid   = $('s_mid').value.trim();
  const sAll   = $('s_all').value.trim();

  const body       = $('body').value.trim();
  const char       = $('char').value.trim();
  const experience = $('experience').value.trim();

  const fmtScore = (val) => {
    return val.toUpperCase() === 'X' ? 'X' : val + '分';
  };

  let out = '';
  out += `#案件发生地 #${place}\n`;
  out += `#嫌疑人姓名 #${target}\n`;
  out += `#日期 ${date}\n`;
  out += `#消费 ${fee}\n`;
  out += `#人照符合度 ${fmtScore(sMatch)}\n`;
  out += `#颜值 ${fmtScore(sFace)}\n`;
  out += `#身材 ${body}\n`;
  out += `#性格 ${char}\n`;
  out += `#上路 ${fmtScore(sTop)}\n`;
  out += `#中路 ${fmtScore(sMid)}\n`;
  out += `#综合评价 ${fmtScore(sAll)}\n`;
  out += `#详细体验 \n${experience}\n\n`;
  out += `#名侦探🕵️ ${detective}\n`;
  out += `#店家联系方式: ${contact}\n\n`;
  out += ARCHIVE_ZT;

  return out;
}

/* ---------- 解析粘贴的报告，回填表单 ---------- */
function parseReport(text){
  if(!text || !text.trim()){
    showToast('❌ 粘贴内容为空', true);
    return false;
  }

  const lines = text.split(/\r?\n/);
  const T = lines.map(l => l.trim());

  function findLine(prefix){
    for(const t of T){
      if(t.startsWith(prefix)) return t.slice(prefix.length).trim();
    }
    return '';
  }

  /* 案件发生地：#案件发生地 #xxx */
  let place = findLine('#案件发生地');
  place = place.replace(/^#/, '').trim();

  /* 嫌疑人姓名：#嫌疑人姓名 #xxx */
  let target = findLine('#嫌疑人姓名');
  target = target.replace(/^#/, '').trim();

  const date    = findLine('#日期');
  const fee     = findLine('#消费');
  const sMatch  = findLine('#人照符合度').replace(/分$/, '').trim();
  const sFace   = findLine('#颜值').replace(/分$/, '').trim();
  const sTop    = findLine('#上路').replace(/分$/, '').trim();
  const sMid    = findLine('#中路').replace(/分$/, '').trim();
  const sAll    = findLine('#综合评价').replace(/分$/, '').trim();

  const body = findLine('#身材');
  const char = findLine('#性格');

  /* 名侦探：优先识别新标签 #名侦探🕵️，兼容旧标签 #侦探名🕵️ / #侦探名 */
  const detective = findLine('#名侦探🕵️').replace(/^🕵️\s*/, '').trim()
                 || findLine('#侦探名🕵️').replace(/^🕵️\s*/, '').trim()
                 || findLine('#侦探名').replace(/^🕵️\s*/, '').trim();

  const contact   = findLine('#店家联系方式:').trim()
                 || findLine('#店家联系方式：').trim()
                 || findLine('#店家联系方式').trim();

  /* 详细体验：#详细体验 到 #名侦探 / #侦探名 之间 */
  let experience = '';
  const eIdx = T.findIndex(t => t.startsWith('#详细体验'));
  if(eIdx !== -1){
    let end = T.length;
    for(let i = eIdx + 1; i < T.length; i++){
      if(T[i].startsWith('#名侦探') ||
         T[i].startsWith('#侦探名') ||
         T[i].startsWith('#店家联系方式')){
        end = i; break;
      }
    }
    experience = lines.slice(eIdx + 1, end).join('\n').trim();
  }

  /* ---- 回填 ---- */
  if(place){
    $('place').value = place;
    $('place').dispatchEvent(new Event('input'));  // 触发嫌疑人建议刷新
  }
  if(target){
    $('target').value = target;
  }

  if(date){
    $('date').value = date.replace(/[\/.]/g, '-');
  }
  $('fee').value        = fee;
  $('detective').value  = detective;
  $('contact').value    = contact;

  $('s_match').value = sMatch;
  $('s_face').value  = sFace;
  $('s_top').value   = sTop;
  $('s_mid').value   = sMid;
  $('s_all').value   = sAll;

  // 统一 X 为大写
  ['s_match','s_face','s_top','s_mid','s_all'].forEach(id => {
    const v = $(id).value.trim();
    if(v.toUpperCase() === 'X') $(id).value = 'X';
  });

  $('body').value       = body;
  $('char').value       = char;
  $('experience').value = experience;

  showToast('✅ 已解析并填充表单');
  return true;
}

/* ---------- 按钮事件 ---------- */

$('parseBtn').addEventListener('click', () => {
  parseReport($('pasteInput').value);
});

$('clearPasteBtn').addEventListener('click', () => {
  $('pasteInput').value = '';
});

$('genBtn').addEventListener('click', () => {
  if(!validate()) return;
  const p = $('preview');
  p.classList.remove('placeholder');
  p.textContent = buildReport();
  p.scrollIntoView({behavior:'smooth', block:'nearest'});
});

$('copyBtn').addEventListener('click', async () => {
  if(!validate()) return;
  const text = buildReport();
  try{
    await navigator.clipboard.writeText(text);
    showToast('已复制到剪贴板 ✓');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制到剪贴板 ✓');
  }
});

$('resetBtn').addEventListener('click', () => {
  document.querySelectorAll('input,textarea').forEach(el => {
    if(el.disabled) return;
    el.value = '';
  });
  $('targetList').innerHTML = '';
  const p = $('preview');
  p.classList.add('placeholder');
  p.textContent = '点击「生成报告」后，最终内容会显示在这里。';
});

/* ---------- Toast ---------- */
function showToast(msg, isError = false){
  const t = $('toast');
  t.textContent = msg;
  t.style.background = isError ? '#ef4444' : 'var(--accent2)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- 启动 ---------- */
initPlaces();
</script>
</body>
</html>
